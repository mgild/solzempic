name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Rustfmt
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Rust Tests
        run: cargo test --workspace --exclude solzempic-integration-tests

      - name: Rust Integration Tests (if prebuilt SBF artifact exists)
        run: |
          if [ -f target/deploy/solzempic_test_program.so ]; then
            cargo test -p solzempic-integration-tests
          else
            echo "Skipping solzempic-integration-tests: target/deploy/solzempic_test_program.so not found"
          fi

  rust-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Audit Dependencies
        run: cargo audit -q

  typescript:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: solzempic-events-ts
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: solzempic-events-ts/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm test -- --runInBand

      - name: Audit
        run: npm audit --audit-level=moderate
